<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scanner">
  <link rel="manifest" href="/scanner/manifest.json">
  <link rel="apple-touch-icon" href="/scanner/icon-192.png">
  <title>WinWin Scanner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --radius: 16px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* ── Layout ── */
    #app { height: 100%; display: flex; flex-direction: column; }

    .screen { display: none; flex-direction: column; height: 100%; overflow-y: auto; }
    .screen.active { display: flex; }

    /* ── Login ── */
    #screen-login {
      justify-content: center;
      align-items: center;
      padding: 24px;
      gap: 32px;
    }

    .login-logo {
      width: 72px; height: 72px;
      background: var(--accent);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }

    .login-title { font-size: 24px; font-weight: 700; text-align: center; }
    .login-sub   { font-size: 14px; color: var(--muted); text-align: center; }

    .login-form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px; }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group label { font-size: 13px; font-weight: 500; color: var(--muted); }
    .field-group input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      padding: 14px 16px;
      outline: none;
      transition: border-color .15s;
      -webkit-appearance: none;
    }
    .field-group input:focus { border-color: var(--accent); }

    .btn {
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(.97); opacity: .9; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); font-size: 14px; }

    #login-error {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      color: var(--error);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      display: none;
    }

    /* ── Scanner ── */
    #screen-scanner {
      position: relative;
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Overlay cadre + UI */
    .scan-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      pointer-events: none;
    }

    .scan-header {
      pointer-events: all;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
      padding-top: max(16px, env(safe-area-inset-top));
      background: linear-gradient(to bottom, rgba(0,0,0,.7), transparent);
    }

    .scan-header-title {
      font-size: 16px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }

    .scan-merchant-badge {
      font-size: 12px;
      background: rgba(99,102,241,.3);
      border: 1px solid rgba(99,102,241,.5);
      color: #a5b4fc;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .btn-logout {
      pointer-events: all;
      background: rgba(255,255,255,.1);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* Viewfinder */
    .scan-frame-wrap {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
    }

    .scan-frame {
      width: 240px; height: 240px;
      position: relative;
    }

    .scan-frame::before,
    .scan-frame::after,
    .scan-frame > span::before,
    .scan-frame > span::after {
      content: '';
      position: absolute;
      width: 32px; height: 32px;
      border-color: #fff;
      border-style: solid;
    }
    .scan-frame::before  { top: 0;    left: 0;   border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .scan-frame::after   { top: 0;    right: 0;  border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .scan-frame > span::before { bottom: 0; left: 0;   border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .scan-frame > span::after  { bottom: 0; right: 0;  border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--accent), transparent);
      animation: scan-move 2s ease-in-out infinite;
    }

    @keyframes scan-move {
      0%, 100% { top: 10%; }
      50%       { top: 86%; }
    }

    .scan-hint {
      font-size: 13px;
      color: rgba(255,255,255,.6);
      text-align: center;
      padding: 12px;
    }

    .scan-footer {
      padding: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0,0,0,.7), transparent);
      display: flex; justify-content: center;
    }

    .btn-manual {
      pointer-events: all;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* Status badge while scanning */
    .scan-status {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,.75);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      display: none;
      white-space: nowrap;
    }

    /* ── Result card ── */
    #screen-result {
      justify-content: flex-end;
      background: rgba(0,0,0,.5);
      position: relative;
    }

    /* Keep camera behind result */
    #screen-result .result-bg {
      position: absolute; inset: 0; z-index: 0;
    }

    .result-sheet {
      position: relative; z-index: 1;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 0 24px 40px;
      padding-bottom: max(40px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 20px;
    }

    .result-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px auto 4px;
    }

    .result-header {
      display: flex; align-items: center; gap: 14px;
    }

    .result-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700;
      flex-shrink: 0;
    }

    .result-name { font-size: 22px; font-weight: 700; }
    .result-serial { font-size: 12px; color: var(--muted); font-family: monospace; }

    /* Progress */
    .progress-section { display: flex; flex-direction: column; gap: 10px; }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 13px; color: var(--muted);
    }
    .progress-value { font-size: 28px; font-weight: 800; }
    .progress-bar-wrap {
      background: var(--border);
      border-radius: 8px;
      height: 10px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%; border-radius: 8px;
      background: var(--accent);
      transition: width .5s ease;
    }

    .dots-wrap {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .dot {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      transition: background .3s, border-color .3s;
    }
    .dot.filled { background: var(--accent); border-color: var(--accent); }
    .dot.filled::after { content: '✓'; color: #fff; font-size: 11px; }

    /* Reward banner */
    .reward-banner {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-radius: 14px;
      padding: 16px;
      display: flex; align-items: center; gap: 12px;
      animation: pop .4s cubic-bezier(.175,.885,.32,1.275);
    }
    .reward-icon { font-size: 32px; }
    .reward-text { flex: 1; }
    .reward-title { font-size: 16px; font-weight: 700; }
    .reward-sub   { font-size: 13px; opacity: .85; }

    @keyframes pop {
      0%   { transform: scale(.8); opacity: 0; }
      100% { transform: scale(1);  opacity: 1; }
    }

    /* Reset banner */
    .reset-banner {
      background: rgba(99,102,241,.15);
      border: 1px solid rgba(99,102,241,.3);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px; color: #a5b4fc;
      display: flex; align-items: center; gap: 8px;
    }

    .result-actions { display: flex; flex-direction: column; gap: 10px; }

    /* ── Error result ── */
    .result-error {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.2);
      border-radius: 12px;
      padding: 16px;
      color: var(--error);
      font-size: 14px;
    }

    /* ── Manual input modal ── */
    #modal-manual {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.7);
      align-items: flex-end;
    }
    #modal-manual.open { display: flex; }

    .modal-sheet {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 20px 24px 40px;
      padding-bottom: max(40px, env(safe-area-inset-bottom));
      width: 100%;
      display: flex; flex-direction: column; gap: 16px;
    }
    .modal-title { font-size: 18px; font-weight: 700; }
    .modal-sub   { font-size: 13px; color: var(--muted); }

    /* ── Misc ── */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    canvas#qr-canvas { display: none; }
  </style>
</head>
<body>
<div id="app">

  <!-- ═══════════════════ LOGIN ═══════════════════ -->
  <div id="screen-login" class="screen active">
    <div class="login-logo">🎯</div>
    <div>
      <div class="login-title" data-i18n="appTitle">WinWin Scanner</div>
      <div class="login-sub" data-i18n="loginSub">Sign in to scan</div>
    </div>
    <form class="login-form" id="login-form" onsubmit="return false">
      <div class="field-group">
        <label for="input-slug" data-i18n="merchantId">Merchant ID (slug)</label>
        <input id="input-slug" type="text" placeholder="cafe-le-central" autocomplete="username"
               autocorrect="off" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field-group">
        <label for="input-password" data-i18n="password">Password</label>
        <input id="input-password" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div id="login-error"></div>
      <button type="submit" class="btn btn-primary" id="btn-login" data-i18n="signIn">Sign in</button>
    </form>
  </div>

  <!-- ═══════════════════ SCANNER ═══════════════════ -->
  <div id="screen-scanner" class="screen">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="qr-canvas"></canvas>
    <div class="scan-overlay">
      <div class="scan-header">
        <div class="scan-header-title">
          <span data-i18n="scannerTitle">Scanner</span>
          <span class="scan-merchant-badge" id="merchant-badge">–</span>
        </div>
        <button class="btn-logout" id="btn-logout" data-i18n="signOut">Sign out</button>
      </div>
      <div class="scan-frame-wrap">
        <div class="scan-frame">
          <span></span>
          <div class="scan-line"></div>
        </div>
      </div>
      <div class="scan-hint" data-i18n="scanHint">Point at the pass QR code</div>
      <div id="scan-status" class="scan-status"></div>
      <div class="scan-footer">
        <button class="btn-manual" id="btn-open-manual" data-i18n="manualEntry">Manual entry</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════ RESULT ═══════════════════ -->
  <div id="screen-result" class="screen">
    <div class="result-sheet" id="result-sheet">
      <div class="result-handle"></div>

      <!-- Header -->
      <div class="result-header" id="result-header">
        <div class="result-avatar" id="result-avatar">?</div>
        <div>
          <div class="result-name" id="result-name">–</div>
          <div class="result-serial" id="result-serial"></div>
        </div>
      </div>

      <!-- Progression -->
      <div class="progress-section" id="progress-section">
        <div class="progress-label">
          <span data-i18n="points">Points</span>
          <span id="progress-fraction">0 / 10</span>
        </div>
        <div class="progress-value" id="progress-value">0</div>
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progress-bar" style="width:0%"></div>
        </div>
        <div class="dots-wrap" id="dots-wrap"></div>
      </div>

      <!-- Reward -->
      <div class="reward-banner" id="reward-banner" style="display:none">
        <div class="reward-icon">🎉</div>
        <div class="reward-text">
          <div class="reward-title" data-i18n="rewardUnlocked">Reward unlocked!</div>
          <div class="reward-sub" id="reward-sub" data-i18n="rewardSubDefault">Client reached their goal</div>
        </div>
      </div>

      <!-- Reset notice -->
      <div class="reset-banner" id="reset-banner" style="display:none" data-i18n="counterReset">
        ↩️ Counter reset after reward
      </div>

      <!-- Error -->
      <div class="result-error" id="result-error" style="display:none"></div>

      <div class="result-actions">
        <button class="btn btn-primary" id="btn-rescan" data-i18n="nextScan">Next scan</button>
        <button class="btn btn-ghost"   id="btn-manual-after" data-i18n="manualEntry">Manual entry</button>
      </div>
    </div>
  </div>

</div>

<!-- ═══════════════════ MODAL SAISIE MANUELLE ═══════════════════ -->
<div id="modal-manual">
  <div class="modal-sheet">
    <div class="modal-title" data-i18n="manualEntry">Manual entry</div>
    <div class="modal-sub" data-i18n="enterSerialSub">Enter the pass serial number</div>
    <div class="field-group">
      <label for="input-serial" data-i18n="serialNumber">Serial number</label>
      <input id="input-serial" type="text" placeholder="serial-xxxxx" autocorrect="off" autocapitalize="none">
    </div>
    <div id="manual-error" style="color:var(--error);font-size:13px;display:none"></div>
    <button class="btn btn-primary" id="btn-manual-submit" data-i18n="submit">Submit</button>
    <button class="btn btn-ghost"   id="btn-manual-cancel" data-i18n="cancel">Cancel</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
const state = {
  token: null,
  marchandNom: null,
  marchandSlug: null,
  scanning: false,
  processing: false,
  stream: null,
  rafId: null,
};

// ═══════════════════════════════════════════════════════
// i18n FR/EN — langue du marchand (via /api/merchants/login), persistée.
// Statique : data-i18n / data-i18n-ph. JS : t('cle', {vars}).
// ═══════════════════════════════════════════════════════
let _lang = 'en';
const I18N = {
  en: {
    appTitle:'WinWin Scanner', loginSub:'Sign in to scan',
    merchantId:'Merchant ID (slug)', password:'Password', signIn:'Sign in',
    scannerTitle:'Scanner', signOut:'Sign out', scanHint:'Point at the pass QR code',
    manualEntry:'Manual entry', points:'Points', rewardUnlocked:'Reward unlocked!',
    rewardSubDefault:'Client reached their goal',
    rewardSub:({prenom,max})=>`${prenom} reached ${max} points — give the reward!`,
    counterReset:'↩️ Counter reset after reward', nextScan:'Next scan',
    enterSerialSub:'Enter the pass serial number', serialNumber:'Serial number',
    submit:'Submit', cancel:'Cancel',
    fillAllFields:'Please fill in all fields', invalidCreds:'Invalid credentials',
    cameraError:({msg})=>'Cannot access camera: '+msg, processing:'⏳ Processing…',
    networkError:({msg})=>'Network error: '+msg, unknownError:'Unknown error', errorName:'Error',
    enterSerial:'Enter a serial number',
  },
  fr: {
    appTitle:'Scanner WinWin', loginSub:'Connectez-vous pour scanner',
    merchantId:'Identifiant marchand (slug)', password:'Mot de passe', signIn:'Se connecter',
    scannerTitle:'Scanner', signOut:'Se déconnecter', scanHint:'Visez le QR code du pass',
    manualEntry:'Saisie manuelle', points:'Points', rewardUnlocked:'Récompense débloquée !',
    rewardSubDefault:'Le client a atteint son objectif',
    rewardSub:({prenom,max})=>`${prenom} a atteint ${max} points — remettez la récompense !`,
    counterReset:'↩️ Compteur remis à zéro après la récompense', nextScan:'Scan suivant',
    enterSerialSub:'Saisissez le numéro de série du pass', serialNumber:'Numéro de série',
    submit:'Valider', cancel:'Annuler',
    fillAllFields:'Veuillez remplir tous les champs', invalidCreds:'Identifiants invalides',
    cameraError:({msg})=>"Impossible d'accéder à la caméra : "+msg, processing:'⏳ Traitement…',
    networkError:({msg})=>'Erreur réseau : '+msg, unknownError:'Erreur inconnue', errorName:'Erreur',
    enterSerial:'Saisissez un numéro de série',
  },
};

function t(key, vars) {
  const dict = I18N[_lang] || I18N.en;
  let s = dict[key] != null ? dict[key] : (I18N.en[key] != null ? I18N.en[key] : key);
  if (typeof s === 'function') return s(vars || {});
  if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => (vars[k] != null ? vars[k] : ''));
  return s;
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
}

function setLang(l) {
  _lang = (l === 'fr' || l === 'en') ? l : 'en';
  document.documentElement.lang = _lang;
  document.title = t('appTitle');
  try { localStorage.setItem('ww_scanner_lang', _lang); } catch {}
  applyI18n();
}

// ═══════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════
function show(id)  { document.getElementById(id).classList.add('active'); }
function hide(id)  { document.getElementById(id).classList.remove('active'); }
function setScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function saveSession(token, slug, nom, langue) {
  state.token = token; state.marchandSlug = slug; state.marchandNom = nom;
  try { localStorage.setItem('ww_token', token); localStorage.setItem('ww_slug', slug); localStorage.setItem('ww_nom', nom); } catch {}
  setLang(langue);
}

function clearSession() {
  state.token = null; state.marchandSlug = null; state.marchandNom = null;
  try { localStorage.removeItem('ww_token'); localStorage.removeItem('ww_slug'); localStorage.removeItem('ww_nom'); } catch {}
}

function restoreSession() {
  try {
    const t = localStorage.getItem('ww_token');
    const s = localStorage.getItem('ww_slug');
    const n = localStorage.getItem('ww_nom');
    if (t && s) { state.token = t; state.marchandSlug = s; state.marchandNom = n || s; return true; }
  } catch {}
  return false;
}

// ═══════════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════════
document.getElementById('login-form').addEventListener('submit', async () => {
  const slug = document.getElementById('input-slug').value.trim();
  const password = document.getElementById('input-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('btn-login');

  errEl.style.display = 'none';
  if (!slug || !password) { showLoginError(t('fillAllFields')); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    const res = await fetch('/api/merchants/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, password, remember_device: true })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t('invalidCreds'));
    saveSession(data.token, slug, data.nom || slug, data.langue);
    startScanner();
  } catch (e) {
    showLoginError(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = t('signIn');
  }
});

function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}

// ═══════════════════════════════════════════════════════
// SCANNER
// ═══════════════════════════════════════════════════════
async function startScanner() {
  document.getElementById('merchant-badge').textContent = state.marchandNom || state.marchandSlug;
  setScreen('screen-scanner');

  // Stop any previous stream
  if (state.stream) state.stream.getTracks().forEach(t => t.stop());

  try {
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    const video = document.getElementById('video');
    video.srcObject = state.stream;
    video.play();
    video.addEventListener('loadeddata', () => {
      state.scanning = true;
      requestAnimationFrame(scanLoop);
    }, { once: true });
  } catch (e) {
    alert(t('cameraError', { msg: e.message }));
  }
}

function stopScanner() {
  state.scanning = false;
  if (state.rafId) cancelAnimationFrame(state.rafId);
  if (state.stream) state.stream.getTracks().forEach(t => t.stop());
  state.stream = null;
}

function scanLoop() {
  if (!state.scanning) return;
  state.rafId = requestAnimationFrame(scanLoop);
  if (state.processing) return;

  const video = document.getElementById('video');
  if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

  const canvas = document.getElementById('qr-canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });

  if (code && code.data) {
    handleScannedData(code.data);
  }
}

async function handleScannedData(raw) {
  if (state.processing) return;
  // Extract serial number from URL or raw string
  // Expected formats: serial-xxx, or https://api.example.com/... (ignore URLs without serial)
  let serial = raw.trim();

  // If it's a URL, try extracting serial from path/query
  try {
    const url = new URL(serial);
    const parts = url.pathname.split('/').filter(Boolean);
    // Look for "serial" segment pattern
    const candidate = parts[parts.length - 1];
    if (candidate && candidate.length > 4) serial = candidate;
  } catch {}

  await submitScan(serial);
}

async function submitScan(serial) {
  if (state.processing) return;
  state.processing = true;

  const statusEl = document.getElementById('scan-status');
  statusEl.textContent = t('processing');
  statusEl.style.display = 'block';

  // Vibrate on mobile
  try { navigator.vibrate && navigator.vibrate(50); } catch {}

  try {
    const res = await fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
      body: JSON.stringify({ serial_number: serial })
    });
    const data = await res.json();

    statusEl.style.display = 'none';
    state.scanning = false;
    stopScanner();
    showResult(data, res.ok, serial);
  } catch (e) {
    statusEl.style.display = 'none';
    state.processing = false;
    showScanError(t('networkError', { msg: e.message }));
  }
}

function showScanError(msg) {
  const statusEl = document.getElementById('scan-status');
  statusEl.textContent = '⚠️ ' + msg;
  statusEl.style.display = 'block';
  setTimeout(() => { statusEl.style.display = 'none'; state.processing = false; }, 3000);
}

// ═══════════════════════════════════════════════════════
// RESULT
// ═══════════════════════════════════════════════════════
function showResult(data, ok, serial) {
  setScreen('screen-result');

  // Reset UI
  document.getElementById('reward-banner').style.display = 'none';
  document.getElementById('reset-banner').style.display = 'none';
  document.getElementById('result-error').style.display = 'none';
  document.getElementById('progress-section').style.display = ok ? '' : 'none';

  if (!ok) {
    const errEl = document.getElementById('result-error');
    errEl.textContent = data.error || t('unknownError');
    errEl.style.display = 'block';
    document.getElementById('result-name').textContent = t('errorName');
    document.getElementById('result-avatar').textContent = '✗';
    document.getElementById('result-avatar').style.background = 'var(--error)';
    document.getElementById('result-serial').textContent = serial;
    return;
  }

  const { prenom, stored_value_apres: val, stored_value_avant, max_value, display_max_value, recompense } = data;
  const stored_value = val ?? data.stored_value ?? 0;
  const displayMax = display_max_value || max_value;

  // Avatar
  const avatarEl = document.getElementById('result-avatar');
  avatarEl.textContent = (prenom || '?').charAt(0).toUpperCase();
  avatarEl.style.background = 'var(--accent)';

  document.getElementById('result-name').textContent = prenom || '–';
  document.getElementById('result-serial').textContent = serial;

  // Progress
  const pct = Math.min(stored_value / displayMax * 100, 100);
  document.getElementById('progress-value').textContent = stored_value;
  document.getElementById('progress-fraction').textContent = `${stored_value} / ${displayMax}`;
  document.getElementById('progress-bar').style.width = pct + '%';

  // Dots
  const dotsWrap = document.getElementById('dots-wrap');
  dotsWrap.innerHTML = '';
  for (let i = 1; i <= displayMax; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i <= stored_value ? ' filled' : '');
    if (!d.classList.contains('filled')) d.textContent = i;
    dotsWrap.appendChild(d);
  }

  // Reward
  if (recompense) {
    document.getElementById('reward-banner').style.display = 'flex';
    document.getElementById('reward-sub').textContent = t('rewardSub', { prenom, max: displayMax });
    document.getElementById('reset-banner').style.display = 'flex';
    try { navigator.vibrate && navigator.vibrate([100, 50, 100, 50, 200]); } catch {}
  }
}

// ═══════════════════════════════════════════════════════
// MANUAL INPUT
// ═══════════════════════════════════════════════════════
function openManual() {
  document.getElementById('modal-manual').classList.add('open');
  document.getElementById('input-serial').value = '';
  document.getElementById('manual-error').style.display = 'none';
  setTimeout(() => document.getElementById('input-serial').focus(), 100);
}

function closeManual() {
  document.getElementById('modal-manual').classList.remove('open');
}

document.getElementById('btn-open-manual').addEventListener('click', openManual);
document.getElementById('btn-manual-after').addEventListener('click', () => {
  openManual();
  setScreen('screen-scanner');
  startScanner();
});
document.getElementById('btn-manual-cancel').addEventListener('click', closeManual);

document.getElementById('btn-manual-submit').addEventListener('click', async () => {
  const serial = document.getElementById('input-serial').value.trim();
  if (!serial) {
    document.getElementById('manual-error').textContent = t('enterSerial');
    document.getElementById('manual-error').style.display = 'block';
    return;
  }
  closeManual();
  state.processing = false;
  await submitScan(serial);
});

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
document.getElementById('btn-rescan').addEventListener('click', () => {
  state.processing = false;
  startScanner();
});

document.getElementById('btn-logout').addEventListener('click', () => {
  stopScanner();
  clearSession();
  state.processing = false;
  setScreen('screen-login');
});

// ═══════════════════════════════════════════════════════
// SERVICE WORKER
// ═══════════════════════════════════════════════════════
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/scanner/sw.js').catch(() => {});
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
// Langue mémorisée (persiste après logout pour garder l'écran de login traduit).
try { _lang = localStorage.getItem('ww_scanner_lang') === 'fr' ? 'fr' : 'en'; } catch {}
document.documentElement.lang = _lang;
document.title = t('appTitle');
applyI18n();

if (restoreSession()) {
  startScanner();
}
</script>
